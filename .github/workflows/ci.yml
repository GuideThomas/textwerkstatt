# Bauen und alle Prüfskripte gegen eine Wegwerf-Datenbank. Kein Deploy, keine Zugangsdaten.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: textwerkstatt_test
          POSTGRES_USER: textwerkstatt
          POSTGRES_PASSWORD: nur-fuer-den-ci-lauf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textwerkstatt -d textwerkstatt_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd client && npm ci
      - name: Bauen (Thema atelier)
        run: npm run build
      - name: Prüfskripte
        run: node scripts/oeffentlich/pruefen.mjs
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: textwerkstatt_test
          DB_USER: textwerkstatt
          DB_PASSWORD: nur-fuer-den-ci-lauf
